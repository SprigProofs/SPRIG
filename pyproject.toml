[project]
name = "sprig"
version = "0.1.0"
description = "A centralised implementation of the SPRIG protocol"
authors = [{ name = "ddorn", email = "diego.dorn@free.fr" }]
requires-python = "~=3.9"
dependencies = [
    "uvicorn>=0.15.0",
    "fastapi>=0.70.0",
    "requests>=2.27.1,<3",
    "gunicorn>=20.1.0",
    "docker>=5.0.3",
]

[dependency-groups]
dev = [
    "mypy>=0.950",
    "pytest>=7.1.1",
    "yapf>=0.32.0",
    "toml>=0.10.2",
    "httpx>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
warn_unused_configs = true
strict = true
exclude = ["tests"]

[tool.yapf]
column_limit = 100
continuation_align_style = "space"
coalesce_brackets = true
indent_dictionary_value = true
